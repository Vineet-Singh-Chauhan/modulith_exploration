spring:
  application:
    name: modulith_exploration
  datasource:
    url: jdbc:h2:mem:ecomm_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:backup.sql # If your script includes table creations
#      # data-locations: classpath:backup.sql # Use this if your script ONLY contains INSERT statements
  h2:
    console:
      enabled: true
      path: /h2-console
    settings:
      web-allow-others: true
    datasource:
      generate-unique-name: false

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: UPDATE
      staleness:
        published: 10m
        processing: 5m   
        resubmitted: 10m 
